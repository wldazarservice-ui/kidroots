[build]
  command = "npm run build"
  publish = "dist"
  # Pas de construction (donc pas de credits Netlify) si seuls des fichiers hors du site ont change
  # (marketing/, scripts/, docs). Code de sortie 0 = on ignore ce deploiement.
  # Redeploiement manuel du meme commit (ex. apres changement de variable) : on construit toujours.
  ignore = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify scripts index.html package.json package-lock.json vite.config.js netlify.toml tailwind.config.js postcss.config.js"

[build.environment]
  # La cle Web Firebase est publique par conception (securite assuree par les regles Firebase)
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyD2rOoIjILi0CsM3qVpghqwEKVcwoYSs9w"
  SECRETS_SCAN_OMIT_PATHS = "dist/assets/*"

# En-tetes de securite sur tout le site (anti-iframe d'un autre site, anti-sniffing, pas d'acces camera/micro/position)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fichiers de l'app avec un nom unique a chaque version : le navigateur peut les garder 1 an
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le service worker ne doit jamais etre mis en cache par le navigateur
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Connexion Google / Firebase Auth servie depuis mokalibo.com (le parent voit mokalibo.com, pas firebaseapp.com)
[[redirects]]
  from = "/__/auth/*"
  to = "https://kidroots-cdaf0.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://kidroots-cdaf0.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Ancienne adresse -> domaine officiel
[[redirects]]
  from = "https://kidroots.netlify.app/*"
  to = "https://mokalibo.com/:splat"
  status = 301
  force = true
