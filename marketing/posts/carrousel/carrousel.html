<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=block" rel="stylesheet">
<link href="../../video/noto-emoji.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:Nunito,sans-serif;color:#1A2A4F}
.e{font-family:'Noto Color Emoji';line-height:1}
.fr{font-family:Fredoka,sans-serif;font-weight:700}
.abs{position:absolute}
.num{left:70px;top:70px;width:110px;height:110px;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:66px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.card{background:#fff;border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.14)}
.foot{left:70px;right:70px;bottom:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:56px}.o{color:#FF6F00}.b{color:#1E88E5}
.swipe{font-size:38px;font-weight:900;color:#fff;background:rgba(26,42,79,.85);border-radius:999px;padding:14px 28px}
</style></head><body><div id="root"></div>
<script>
const C = [
  ['🇯🇵','Japon','#FFEBEE','#E53935','Le pays des samouraïs, des cerisiers en fleur et des trains ultra-rapides.','🦢','Fabriquez une grue en papier : c’est un origami traditionnel japonais !'],
  ['🇪🇬','Égypte','#FFF8E1','#E65100','Les pyramides de Gizeh ont été construites il y a plus de 4 500 ans.','✍️','Écrivez le prénom de votre enfant en hiéroglyphes.'],
  ['🇧🇷','Brésil','#E8F5E9','#2E7D32','Il abrite la plus grande partie de l’Amazonie, la plus grande forêt tropicale du monde.','💃','Écoutez de la samba et cherchez le fleuve Amazone sur une carte.'],
  ['🇲🇽','Mexique','#E0F7FA','#00838F','Les Aztèques avaient bâti une immense ville sur un lac : Tenochtitlan, aujourd’hui Mexico.','🥑','Goûtez un avocat : ce fruit vient du Mexique !'],
  ['🇳🇴','Norvège','#EDE7F6','#4527A0','Le 17 mai, les enfants défilent dans les rues pour la fête nationale.','🎨','Dessinez une aurore boréale à la craie sur du papier noir.'],
]
const nb = (x) => x.replace(/ ([?!:;»])/g, '\u00a0$1').replace(/(\d) (\d)/g, '$1\u00a0$2').replace(/(\d) (ans)/g, '$1\u00a0$2')
const v = new URLSearchParams(location.search).get('s')
const foot = (swipe) => `<div class="abs foot"><div class="logo fr"><span class="o">Moka</span><span class="b">libo</span></div>${swipe ? '<div class="swipe">Glisse →</div>' : ''}</div>`
let html
if (v === '0') {
  html = `<div class="abs" style="inset:0;background:linear-gradient(160deg,#FFE27A,#FFB347 50%,#FF8A3D)"></div>
  <div class="abs fr" style="left:70px;top:90px;background:#fff;border-radius:999px;padding:14px 32px;font-size:40px">🗓️ Idées pour le week-end</div>
  <div class="abs fr" style="left:70px;right:70px;top:220px;font-size:108px;line-height:1.02;color:#fff;text-shadow:0 8px 24px rgba(0,0,0,.18)">5 pays à découvrir ce week-end avec ton enfant</div>
  <div class="abs e" style="left:70px;top:820px;font-size:132px;letter-spacing:14px;white-space:nowrap">🇯🇵🇪🇬🇧🇷🇲🇽🇳🇴</div>
  <div class="abs fr" style="left:70px;top:1030px;font-size:44px;color:#fff">+ une activité facile pour chaque pays 🎨</div>` + foot(true)
} else if (v === '6') {
  html = `<div class="abs" style="inset:0;background:linear-gradient(165deg,#43C27A,#1E88E5)"></div>
  <div class="abs e" style="left:50%;top:120px;transform:translateX(-50%);font-size:200px">🌍</div>
  <div class="abs fr" style="left:60px;right:60px;top:380px;text-align:center;color:#fff;font-size:84px;line-height:1.08;text-shadow:0 8px 24px rgba(0,0,0,.2)">Et 190 autres pays t’attendent sur Mokalibo&nbsp;!</div>
  <div class="abs card fr" style="left:110px;right:110px;top:690px;padding:34px;text-align:center;font-size:44px;line-height:1.4">📖 Histoires vraies lues à voix haute<br>🎯 Un quiz à chaque chapitre<br>🛂 Un passeport à tamponner</div>
  <div class="abs fr" style="left:50%;top:1010px;transform:translateX(-50%);background:#FFD600;border-radius:36px;padding:24px 50px;font-size:64px;white-space:nowrap;box-shadow:0 12px 0 #E6A100">🎁 3 jours gratuits</div>
  <div class="abs fr" style="left:0;right:0;top:1170px;text-align:center;color:#fff;font-size:42px">🔖 Enregistre ce post pour ce week-end</div>`
} else {
  const [flag, name, bg, col, fact, ae, act] = C[Number(v) - 1]
  html = `<div class="abs" style="inset:0;background:${bg}"></div>
  <div class="abs num fr" style="color:${col}">${v}</div>
  <div class="abs e" style="right:80px;top:70px;font-size:190px">${flag}</div>
  <div class="abs fr" style="left:70px;top:300px;font-size:120px;color:${col}">${name}</div>
  <div class="abs card" style="left:70px;right:70px;top:470px;padding:44px 48px">
    <div class="fr" style="font-size:36px;color:#78909C;margin-bottom:12px">💡 LE SAVAIS-TU ?</div>
    <div style="font-size:52px;font-weight:900;line-height:1.3">${nb(fact)}</div></div>
  <div class="abs card" style="left:70px;right:70px;top:850px;padding:40px 48px;display:flex;gap:30px;align-items:center;background:${col};color:#fff">
    <span class="e" style="font-size:110px">${ae}</span>
    <div><div class="fr" style="font-size:36px;opacity:.85;margin-bottom:8px">ACTIVITÉ EN FAMILLE</div><div style="font-size:44px;font-weight:900;line-height:1.3">${nb(act)}</div></div></div>` + foot(true)
}
document.getElementById('root').innerHTML = html
</script></body></html>
