<style>
  /* Moka & Libo, episode 2 : l'Egypte (40 s, 1080x1920). Une histoire muette : les heros « parlent » en petits sons et en bulles d'emotions.
     Fil de la serie : la chambre de Moka -> le globe choisit le pays -> le voyage -> une decouverte -> un geste du pays -> tampon du passeport -> teaser du prochain pays. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

  .e { font-family: 'Noto Color Emoji'; line-height: 1; }
  .fr { font-family: Fredoka, sans-serif; font-weight: 700; }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; inset: 0; }
  .emote { position: absolute; left: 0; top: 0; width: 150px; height: 150px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 84px; box-shadow: 0 10px 0 rgba(0,0,0,.08), 0 18px 40px rgba(0,0,0,.2); }
  .emote::after { content: ''; position: absolute; bottom: -14px; left: 34px; width: 34px; height: 34px; background: #fff; border-radius: 50%; }
  .emote .fr { font-size: 96px; color: #FF6F00; }
  .cap { position: absolute; left: 60px; right: 60px; top: 1640px; background: rgba(255,255,255,.95); border-radius: 40px; padding: 26px 34px; font-size: 46px; line-height: 1.25; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
  .petal { position: absolute; left: 0; top: 0; width: 28px; height: 20px; border-radius: 60% 0 60% 0; background: #FFB7C9; }
  .spark { position: absolute; left: 0; top: 0; font-size: 70px; }
  .petal { width: 12px !important; height: 12px !important; border-radius: 50% !important; background: #FFE0A3 !important; opacity: .8; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.22) 100%); }
  #wipe { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>

<script>
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const io = (x) => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2 }
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const win = (t, a, b, f = .35) => clamp(Math.min((t - a) / f, (b - t) / f))
const lerp = (a, b, x) => a + (b - a) * x
const tf = (el, x, y, s = 1, r = 0, o = 1, sx = 1, sy = 1) => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s * sx},${s * sy})`; el.style.opacity = o }
const vis = (id, on) => { $(id).style.opacity = on ? 1 : 0 }

// Decors generes une fois
$('fclouds').innerHTML = Array.from({ length: 8 }, (_, i) => `<div class="abs e" data-i="${i}" style="font-size:${130 + (i % 3) * 60}px">☁️</div>`).join('')
$('waves').innerHTML = Array.from({ length: 12 }, (_, i) => `<div class="abs" data-i="${i}" style="width:120px;height:14px;border-radius:7px;background:rgba(255,255,255,.6)"></div>`).join('')
$('petals').innerHTML = Array.from({ length: 28 }, (_, i) => `<div class="petal" data-i="${i}"></div>`).join('')
$('stars').innerHTML = Array.from({ length: 40 }, (_, i) => `<div class="abs" style="width:6px;height:6px;border-radius:50%;background:#fff;opacity:${.4 + (i % 3) * .2};transform:translate(${(i * 263) % 1080}px,${(i * 137) % 1000}px)"></div>`).join('')
$('hearts').innerHTML = Array.from({ length: 5 }, (_, i) => `<div class="abs e" data-i="${i}" style="font-size:70px;opacity:0">❤️</div>`).join('')
$('sparks').innerHTML = Array.from({ length: 8 }, (_, i) => `<div class="spark e" data-i="${i}" style="opacity:0">✨</div>`).join('')

// Bulles d'emotion : [debut, fin, qui, contenu]
const EMOTES = [
  [1.0, 2.6, 'L', '<span class="fr" style="font-size:70px;color:#5C6BC0">zZz</span>'],
  [6.7, 7.6, 'M', '<span class="fr">!</span>'],
  [7.6, 8.5, 'L', '<span class="e">🇪🇬</span>'],
  [16.9, 17.8, 'L', '<span class="e">☀️</span>'],
  [18.0, 18.9, 'M', '<span class="e">📜</span>'],
  [21.0, 22.2, 'L', '<span class="e">🦜</span>'],
  [24.9, 25.9, 'L', '<span class="e">😍</span>'],
  [28.0, 29.4, 'M', '<span class="e">💛</span>'],
  [36.2, 37.4, 'M', '<span class="fr">?</span>'],
  [36.6, 37.8, 'L', '<span class="e">🤩</span>'],
]
const CAPS = [
  [19.0, 23.0, '<span class="e">📜</span> Il y a plus de 5 000 ans, les Égyptiens écrivaient avec des dessins : les <span style="color:#E65100">hiéroglyphes</span>.'],
  [23.6, 27.6, '<span class="e">🔺</span> La Grande Pyramide a été construite il y a plus de <span style="color:#C62828">4 500 ans</span> !'],
  [27.8, 30.0, '<span class="e">🤝</span> En Égypte, on accueille avec « Ahlan wa sahlan » : bienvenue !'],
]

window.ready = async () => { await document.fonts.ready; await document.fonts.load('60px "Noto Color Emoji"', '☁️🇯🇵🇪🇬☀️📜🦜😍💛🤩🔺🤝👁️🐍❤️✨🌍🧸') }

window.render = function (t) {
  $('camel').style.opacity = 0; $('onigiri').style.opacity = 0
  // ── Scenes et fondus ──
  const sRoom = t < 9.4 || (t >= 34.6 && t < 34.6) ? 1 : 0
  $('room').style.opacity = t < 9.6 ? 1 : 0
  $('flight').style.opacity = t >= 9.2 && t < 15.2 ? 1 : 0
  $('japan').style.opacity = t >= 15 && t < 30.4 ? 1 : 0
  $('pass').style.opacity = t >= 30.2 && t < 35 ? 1 : 0
  $('teaser').style.opacity = t >= 34.8 ? 1 : 0
  // Transitions : flash blanc (entree dans le globe, atterrissage, passeport, teaser)
  const w = Math.max(win(t, 8.9, 9.8, .45), win(t, 14.6, 15.5, .45), win(t, 29.9, 30.6, .35), win(t, 34.5, 35.2, .35))
  $('wipe').style.opacity = w

  // ── Titre ──
  $('title').style.opacity = win(t, .2, 3.2, .4)
  $('title').style.transform = `translateY(${(1 - back(seg(t, .2, .9))) * -160}px)`

  // ── Moka : etats par defaut ──
  const blink = (t % 3.3) < .13
  vis('eyesOpen', !blink); vis('eyesHappy', false); vis('mouthSmile', true); vis('mouthO', false); vis('mouthChew', false); vis('pack', t > 8.2 && t < 34.6); vis('book2', t < 6.6)
  $('moka').style.transformOrigin = '150px 440px'; $('libo').style.transformOrigin = '100px 180px'
  $('mokaArmL').style.transformOrigin = '51px 152px'; $('mokaArmR').style.transformOrigin = '149px 152px'
  let armL = 12, armR = -12, mx, my, ms = 1.45, mo = 1, mr = 0, sq = 1
  let look = 0 // regard (decalage des pupilles)

  // ── Libo : etats par defaut ──
  const flap = Math.sin(t * 24) * 38
  $('liboWing').style.transformOrigin = '44px 60px'
  let lx, ly, ls = 1.4, lo = 1, lr = 0, wing = flap, eyesShut = false, beak = 0

  if (t < 9.6) {
    // Chambre : Moka lit, Libo dort, puis se reveille et fait tourner le globe
    mx = 360; my = 1150
    look = t < 6.6 ? -3 : 4
    armL = 50; armR = -50
    if (t > 6.6) { vis('mouthO', true); vis('mouthSmile', false); armL = 12; armR = -12 }
    if (t > 7.8) { vis('mouthO', false); vis('mouthSmile', true); vis('eyesHappy', true); vis('eyesOpen', false); armR = -150 + Math.sin(t * 12) * 20; armL = 150 - Math.sin(t * 12) * 20 }
    // saut de joie et sac a dos
    const jump = t > 7.8 && t < 8.9 ? Math.abs(Math.sin((t - 7.8) * 8)) * 60 : 0
    my -= jump
    sq = t > 7.8 && t < 8.9 ? 1 + Math.sin((t - 7.8) * 16) * .04 : 1
    // Libo
    if (t < 2.8) { lx = 115; ly = 760; wing = 0; eyesShut = true; lr = Math.sin(t * 2) * 2 }
    else if (t < 3.6) { lx = 115; ly = 760 - Math.sin((t - 2.8) * 8) * 15; wing = 0; beak = 1 }
    else if (t < 4.6) { const k = io(seg(t, 3.6, 4.6)); lx = lerp(115, 760, k); ly = lerp(760, 720, k) - Math.sin(k * Math.PI) * 220 }
    else { lx = 760 + Math.sin(t * 3) * 10; ly = 720 + Math.sin(t * 6) * 8; wing = t < 6.4 ? flap : Math.sin(t * 24) * 20 }
    // Globe : Libo le fait tourner, il ralentit et s'arrete sur l'Egypte
    const spin = t < 4.6 ? 0 : t < 6.4 ? Math.pow(seg(t, 4.6, 6.4), .6) * 1600 : 1600
    $('lands').setAttribute('transform', `translate(${-(spin % 440)},0)`)
    $('pin').style.opacity = t > 6.4 ? 1 : 0
    $('pin').setAttribute('transform', `translate(-90,${(t > 6.4 ? (1 - back(seg(t, 6.4, 6.8))) * -60 : 0) + 20})`)
    // Zoom dans le globe
    const z = io(seg(t, 8.6, 9.6))
    $('room').style.transform = `scale(${1 + z * 2.4})`; $('room').style.transformOrigin = '780px 1080px'
  }
  if (t >= 9.2 && t < 15.2) {
    // Voyage : avion en papier, Moka assis dessus, Libo vole a cote ; les pyramides apparaissent
    const k = seg(t, 9.2, 15.2)
    const px = lerp(-200, 380, io(seg(t, 9.2, 11))) + Math.sin(t * 1.3) * 30
    const py = 900 + Math.sin(t * 2.2) * 30
    tf($('plane'), px, py, 1, -6 + Math.sin(t * 2.2) * 3)
    mx = px + 210; my = py - 250; ms = 1.05; armR = -150 + Math.sin(t * 10) * 15; vis('eyesHappy', true); vis('eyesOpen', false)
    lx = px + 470 + Math.sin(t * 3) * 20; ly = py - 230 + Math.sin(t * 5) * 30; ls = 1.1
    document.querySelectorAll('#fclouds > div').forEach((c) => { const i = +c.dataset.i; const x = ((i * 300 + t * 380 * (1 + (i % 3) * .4)) % 1700) - 300; c.style.transform = `translate(${1080 - x}px,${140 + i * 150}px)` })
    document.querySelectorAll('#waves > div').forEach((c) => { const i = +c.dataset.i; const x = ((i * 190 + t * 500) % 1400) - 200; c.style.transform = `translate(${1080 - x}px,${1440 + (i % 4) * 110}px)` })
    const f = seg(t, 12.2, 14.6)
    $('fujiFar').style.opacity = f
    $('fujiFar').style.transform = `translate(${-f * 300}px,0) scale(${1 + f * .3})`; $('fujiFar').style.transformOrigin = '820px 1400px'
  }
  if (t >= 15 && t < 30.4) {
    // Egypte : arrivee, sable, papyrus, chameau, accueil
    document.querySelectorAll('#petals > div').forEach((p) => { const i = +p.dataset.i; const y = ((i * 211 + t * (90 + (i % 5) * 25)) % 2100) - 100; const x = (i * 157) % 1080 + Math.sin(t * 1.5 + i) * 40; p.style.transform = `translate(${x}px,${y}px) rotate(${t * 90 + i * 30}deg)` })
    const walk = io(seg(t, 15.2, 16.6))
    mx = lerp(-300, 250, walk); my = 1130 - (t < 16.6 ? Math.abs(Math.sin(t * 10)) * 20 : 0)
    lx = lerp(-500, 560, io(seg(t, 15.8, 17.1))) + Math.sin(t * 1.7) * 30; ly = 1000 + Math.sin(t * 3) * 30
    // Libo attrape un petale
    if (t > 16.6 && t < 17.8) { lx = 560 + Math.sin(t * 6) * 10; ly = 900 + Math.sin(t * 6) * 40; beak = 1 }
    // Papyrus : Moka le deroule, Libo y reconnait un oiseau comme lui (coeurs)
    const on = $('onigiri')
    if (t > 17.9 && t < 22.4) {
      armR = -60
      const ox = mx + 230, oy = my + 120
      tf(on, ox, oy - (1 - back(seg(t, 17.9, 18.3))) * 80, 1, 0, 1)
      if (t > 19 && t < 20.4) { vis('mouthO', true); vis('mouthSmile', false); look = 4 }
      if (t > 20.4) { lx = mx + 330; ly = my + 40 + Math.sin(t * 8) * 6; beak = Math.floor(t * 8) % 2; ls = 1.3 }
      const h = seg(t, 20.8, 22.4)
      document.querySelectorAll('#hearts > div').forEach((el) => { const i = +el.dataset.i; tf(el, mx + 80 + i * 70, my - 40 - h * (220 + i * 40), 1, (i - 2) * 10, h > 0 && h < 1 ? 1 - h * .6 : 0) })
    } else { on.style.opacity = 0; document.querySelectorAll('#hearts > div').forEach((el) => { el.style.opacity = 0 }) }
    // Le chameau arrive devant les pyramides, Libo se pose sur sa bosse
    const cm = $('camel')
    if (t > 23.0 && t < 28.2) {
      const k = io(seg(t, 23.0, 24.6)), walking = t < 24.6
      const cx = lerp(1150, 520, k), cy = my - 50 - (walking ? Math.abs(Math.sin(t * 7)) * 10 : 0)
      tf(cm, cx, cy, 1.9, 0, clamp((28.2 - t) / .3))
      const sw = walking ? Math.sin(t * 7) * 14 : 0
      $('legA').setAttribute('transform', `rotate(${sw} 150 150)`); $('legB').setAttribute('transform', `rotate(${-sw} 150 150)`)
      if (t > 24.8) { lx = cx + 190; ly = cy - 60 + Math.sin(t * 6) * 5; ls = 1.2; wing = Math.sin(t * 24) * 10 }
      if (t > 24.8 && t < 27.2) { armR = -120 + Math.sin(t * 8) * 15; vis('eyesHappy', true); vis('eyesOpen', false) }
    }
    // Accueil : la main sur le coeur
    if (t > 28 && t < 30) { const b = Math.sin(seg(t, 28.3, 29.7) * Math.PI); armR = 55 * b; mr = b * 5; lr = b * 15; vis('eyesHappy', true); vis('eyesOpen', false) }
  }
  if (t >= 30.2 && t < 35) {
    // Passeport : apres le Japon, le tampon de l'Egypte
    const op = back(seg(t, 30.4, 31))
    $('book').style.transform = `translate(110px,${620 + (1 - op) * 400}px) scale(${.8 + .2 * op})`
    const st = $('stamp'); const s = seg(t, 31.6, 31.85)
    st.style.opacity = t > 31.6 ? 1 : 0
    st.style.transform = `rotate(-14deg) scale(${t > 31.6 ? lerp(2.2, 1, io(s)) : 2.2})`
    mx = 140; my = 1380; ms = 1.2; lx = 760; ly = 1420 + Math.sin(t * 4) * 20; ls = 1.2
    if (t > 31.9) { vis('eyesHappy', true); vis('eyesOpen', false); armR = -150 + Math.sin(t * 12) * 20; armL = 150 - Math.sin(t * 12) * 20; my -= Math.abs(Math.sin((t - 31.9) * 7)) * 50 }
    const sp = seg(t, 31.7, 33)
    document.querySelectorAll('#sparks > div').forEach((el) => { const i = +el.dataset.i, a = i / 8 * Math.PI * 2; tf(el, 540 + Math.cos(a) * (180 + sp * 260) - 35, 940 + Math.sin(a) * (180 + sp * 260) - 35, 1, 0, sp > 0 && sp < 1 ? 1 - sp : 0) })
  } else document.querySelectorAll('#sparks > div').forEach((el) => { el.style.opacity = 0 })
  if (t >= 34.8) {
    // Teaser : la jungle (le Bresil, pays des perroquets), un point d'interrogation… et le logo
    $('tText').style.opacity = win(t, 35.2, 41, .5)
    tf($('qmark'), 470, 1090 + Math.sin(t * 3) * 14, 1 + Math.sin(t * 4) * .04, 0, seg(t, 35.6, 36.1))
    $('pyr').setAttribute('opacity', .6 * seg(t, 35, 35.8))
    mx = 90; my = 1300; ms = 1.2; look = 4; lx = 820; ly = 1250 + Math.sin(t * 4) * 20; ls = 1.2
    if (t > 37.4) { vis('eyesHappy', true); vis('eyesOpen', false); armR = -150 + Math.sin(t * 12) * 20 }
    $('logo').style.opacity = seg(t, 37.6, 38.2)
    $('logo').style.transform = `translateY(${(1 - back(seg(t, 37.6, 38.3))) * 80}px)`
  }

  // ── Application des poses ──
  $('mokaArmL').style.transform = `rotate(${armL}deg)`; $('mokaArmR').style.transform = `rotate(${armR}deg)`
  $('pupL').setAttribute('cx', 82 + look); $('pupR').setAttribute('cx', 122 + look)
  tf($('moka'), mx, my, ms, mr, mo, 1 / sq, sq)
  $('liboWing').style.transform = `rotate(${wing}deg)`
  vis('liboEyeOpen', !eyesShut && !((t % 2.7) < .12)); vis('liboEyeShut', eyesShut || (t % 2.7) < .12)
  $('liboBeak').setAttribute('transform', beak ? 'rotate(14 82 44)' : '')
  tf($('libo'), lx, ly, ls, lr, lo)

  // ── Bulles d'emotion (au-dessus de la tete du personnage) ──
  for (const who of ['M', 'L']) {
    const el = $('em' + who); const cur = EMOTES.find((e) => e[2] === who && t >= e[0] && t < e[1])
    if (!cur) { el.style.opacity = 0; continue }
    el.innerHTML = cur[3]
    const p = back(seg(t, cur[0], cur[0] + .3)), o = win(t, cur[0], cur[1], .2)
    const bx = who === 'M' ? mx + 170 * ms / 1.45 : lx + 120, by = who === 'M' ? my - 200 * ms / 1.45 : ly - 150
    tf(el, bx, by, p, 0, o)
  }
  // ── Petites legendes (pour les parents) ──
  const c = CAPS.find((x) => t >= x[0] && t < x[1])
  $('cap').style.opacity = c ? win(t, c[0], c[1], .3) : 0
  if (c) $('cap').innerHTML = c[2]
}
</script>
</body>
</html>
