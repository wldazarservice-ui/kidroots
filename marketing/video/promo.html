<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B1E4A; }
  body { font-family: 'Nunito', 'Noto Color Emoji', sans-serif; color: #1A2A4F; -webkit-font-smoothing: antialiased; }
  .e { font-family: 'Noto Color Emoji'; line-height: 1; display: inline-block; }
  .abs { position: absolute; }
  #root { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
  #bg { position: absolute; inset: 0; }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: 0.75; }
  #grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; }
  /* Téléphone */
  #stage3d { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 40%; }
  #phone { position: absolute; width: 600px; height: 1298px; left: 240px; top: 470px; transform-style: preserve-3d; }
  #phoneBody { position: absolute; inset: 0; border-radius: 92px; background: linear-gradient(145deg, #2B2F3A, #0E1015); box-shadow: inset 0 0 0 3px #4A4F5C, inset 0 0 0 10px #111; }
  #screen { position: absolute; left: 22px; top: 22px; width: 556px; height: 1254px; border-radius: 72px; overflow: hidden; background: #FFF8EC; }
  #screen img { position: absolute; left: 0; top: 0; width: 556px; opacity: 0; will-change: transform, opacity; }
  #island { position: absolute; left: 50%; top: 40px; width: 170px; height: 48px; margin-left: -85px; border-radius: 30px; background: #000; }
  #glare { position: absolute; inset: 0; border-radius: 92px; background: linear-gradient(115deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 35%); pointer-events: none; }
  #shadow { position: absolute; width: 560px; height: 80px; border-radius: 50%; background: rgba(0,0,0,0.35); filter: blur(40px); }
  #tap { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 8px solid rgba(255,255,255,0.95); background: rgba(255,255,255,0.35); box-shadow: 0 0 30px rgba(0,0,0,0.25); opacity: 0; }
  /* Texte */
  .hl { font-family: 'Fredoka', sans-serif; font-weight: 700; text-align: center; line-height: 1.04; letter-spacing: -1px; }
  .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.12em 0.08em; margin: 0 -0.06em; }
  .w > span { display: inline-block; will-change: transform; }
  .hi { color: #FFC400; }
  .chip { display: inline-flex; align-items: center; gap: 18px; border-radius: 999px; padding: 18px 36px; font-weight: 900; font-size: 44px; }
  .card { background: white; border-radius: 44px; box-shadow: 0 30px 70px rgba(10,30,80,0.22); }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root">
  <div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div></div>
  <div id="layerBack" class="abs" style="inset:0"></div>
  <div id="stage3d">
    <div id="shadow"></div>
    <div id="phone"><div id="phoneBody"></div><div id="screen"></div><div id="island"></div><div id="glare"></div></div>
  </div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="layerFront" class="abs" style="inset:0"></div>
  <div id="grain"></div>
  <div id="flash"></div>
</div>
<script>
const LANG = new URLSearchParams(location.search).get('lang') || 'fr'
const TXT = {
  fr: {
    hook: [['«', 'Papa,'], ['c’est', 'où'], ['le', '*Mali* ?', '»']],
    s2: [['Avec', '*Mokalibo*,'], ['il', 'le', 'sait.']], s2b: 'L’histoire du monde, racontée aux enfants',
    s3: 'pays à explorer', s3b: 'Sur les 5 continents',
    s4: [['Des', 'histoires'], ['*vraies*']], s4b: 'lues à voix haute',
    s5: [['Un', '*quiz*'], ['à', 'chaque', 'chapitre']], s5b: '+190 XP',
    s6: [['Remplis', 'ton'], ['*passeport*']], s6b: 'Un tampon pour chaque pays',
    s7: [['*3* niveaux'], ['de', '4', 'à', '12', 'ans']], s7b: [['Et', 'des'], ['*jeux*', '!']],
    s8: [['Pensé', 'pour'], ['les', '*parents*']],
    badges: [['🚫', 'Sans publicité'], ['🔒', 'Sans traceur'], ['⏱️', 'Temps d’écran réglable'], ['👨‍👩‍👧‍👦', 'Jusqu’à 5 enfants']],
    cta: 'Essaie gratuitement', ctaSub: 'Sans compte · 2 histoires offertes chaque jour',
  },
  en: {
    hook: [['“Dad,'], ['where', 'is'], ['*Mali*?”']],
    s2: [['With', '*Mokalibo*,'], ['they', 'know.']], s2b: 'World history, told for kids',
    s3: 'countries to explore', s3b: 'Across all 5 continents',
    s4: [['*True*'], ['stories']], s4b: 'read aloud',
    s5: [['A', '*quiz*', 'in'], ['every', 'chapter']], s5b: '+190 XP',
    s6: [['Fill', 'your'], ['*passport*']], s6b: 'A stamp for every country',
    s7: [['*3* reading'], ['levels,', 'ages', '4-12']], s7b: [['And', '*games*!']],
    s8: [['Made', 'for'], ['*parents*', 'too']],
    badges: [['🚫', 'No ads'], ['🔒', 'No trackers'], ['⏱️', 'Screen-time limits'], ['👨‍👩‍👧‍👦', 'Up to 5 kids']],
    cta: 'Try it for free', ctaSub: 'No account needed · 2 free stories every day',
  },
  de: {
    hook: [['„Papa,'], ['wo', 'liegt'], ['*Mali*?“']],
    s2: [['Mit', '*Mokalibo*'], ['weiß', 'er', 'es.']], s2b: 'Weltgeschichte, für Kinder erzählt',
    s3: 'Länder zum Entdecken', s3b: 'Auf allen 5 Kontinenten',
    s4: [['*Wahre*'], ['Geschichten']], s4b: 'zum Vorlesen',
    s5: [['Ein', '*Quiz*', 'in'], ['jedem', 'Kapitel']], s5b: '+190 XP',
    s6: [['Füll', 'deinen'], ['*Reisepass*']], s6b: 'Ein Stempel für jedes Land',
    s7: [['*3* Lesestufen'], ['von', '4', 'bis', '12']], s7b: [['Und', '*Spiele*!']],
    s8: [['Gemacht', 'für'], ['*Eltern*']],
    badges: [['🚫', 'Ohne Werbung'], ['🔒', 'Ohne Tracker'], ['⏱️', 'Bildschirmzeit-Limit'], ['👨‍👩‍👧‍👦', 'Bis zu 5 Kinder']],
    cta: 'Jetzt gratis testen', ctaSub: 'Ohne Konto · 2 Geschichten gratis pro Tag',
  },
}[LANG]
const COUNT = Number(new URLSearchParams(location.search).get('count') || 160)

// ── maths ──
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, x) => a + (b - a) * x
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const back = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)
const spring = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x)

// ── éléments ──
const $ = (id) => document.getElementById(id)
const phone = $('phone'), screenEl = $('screen'), shadow = $('shadow'), front = $('layerFront'), backL = $('layerBack')
const SHOTS = ['home', 'home_full', 'regions_full', 'country', 'intro', 'card1_open', 'card2_open', 'quiz', 'quiz_ok', 'result', 'map', 'passport_full', 'levels', 'games']
const IMG = {}
for (const n of SHOTS) { const im = new Image(); im.src = `shots/${LANG}/${n}.png`; screenEl.appendChild(im); IMG[n] = im }
const tap = document.createElement('div'); tap.id = 'tap'; screenEl.appendChild(tap)
const fx = $('fx').getContext('2d')

function setPhone({ x = 0, y = 0, s = 1, rx = 0, ry = 0, rz = 0, blur = 0, op = 1 }) {
  phone.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`
  phone.style.filter = blur > 0.3 ? `blur(${blur}px)` : 'none'
  phone.style.opacity = op
  shadow.style.cssText = `left:${260 + x}px;top:${1700 + y * 0.6}px;opacity:${op * 0.9};transform:scale(${s})`
}
// Affiche un écran (fondu + glissement) ; scroll = décalage vertical en px écran
function screen(name, op, { dx = 0, scroll = 0, s = 1 } = {}) {
  const im = IMG[name]; if (!im) return
  im.style.opacity = op
  im.style.transform = `translate(${dx}px, ${-scroll}px) scale(${s})`
}
function hideScreens() { for (const n of SHOTS) IMG[n].style.opacity = 0; tap.style.opacity = 0 }

// ── titres : mots qui montent depuis un masque ──
let builtKey = null
function buildText(key, html) { if (builtKey !== key) { front.innerHTML = html; builtKey = key } }
function wordsHTML(lines, size, color = 'white', top = 170, extra = '') {
  let i = 0
  const L = lines.map((ln) => ln.map((w) => {
    const hi = /^\*.*\*/.test(w)
    const txt = w.replace(/\*(.*?)\*/, '<span class="hi">$1</span>')
    return `<span class="w"><span data-i="${i++}">${txt}</span></span>`
  }).join(' ')).join('<br>')
  return `<div class="abs hl" id="hl" style="left:40px;right:40px;top:${top}px;font-size:${size}px;color:${color};${extra}">${L}</div>`
}
function animWords(t, start, gap = 0.09, dur = 0.5, out = null) {
  document.querySelectorAll('#hl [data-i]').forEach((el) => {
    const i = Number(el.dataset.i)
    const p = eo5(prog(t, start + i * gap, start + i * gap + dur))
    let y = (1 - p) * 110, o = 1
    if (out != null) { const q = eio(prog(t, out, out + 0.35)); y -= q * 110 }
    el.style.transform = `translateY(${y}%) rotate(${(1 - p) * 6}deg)`
    el.style.opacity = o
  })
}

// ── fonds ──
function bg(c1, c2, c3, base, t) {
  document.body.style.background = base
  $('bg').style.background = base
  const B = [['b1', c1, 200, 300, 0], ['b2', c2, 700, 900, 2], ['b3', c3, 300, 1500, 4]]
  for (const [id, col, x, y, ph] of B) {
    const el = $(id)
    el.style.background = col
    el.style.left = `${x - 450 + Math.sin(t * 0.5 + ph) * 120}px`
    el.style.top = `${y - 450 + Math.cos(t * 0.4 + ph) * 120}px`
  }
}

// ── particules (canvas) ──
const COLS = ['#FFC400', '#FF6F00', '#1E88E5', '#43C27A', '#E91E63', '#7E57C2', '#FFFFFF']
function confetti(t, t0, cx, cy, n = 90, power = 1) {
  const p = t - t0; if (p < 0 || p > 2.6) return
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + i * 1.7, v = (900 + (i * 53) % 900) * power
    const x = cx + Math.cos(a) * v * p * 0.9, y = cy + Math.sin(a) * v * p * 0.7 + 1500 * p * p
    fx.save(); fx.translate(x, y); fx.rotate(i + p * 8); fx.globalAlpha = clamp(1.4 - p / 1.8)
    fx.fillStyle = COLS[i % COLS.length]; fx.fillRect(-14, -7, 28, 14); fx.restore()
  }
}
function sparkles(t, cx, cy, r, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = i * 2.4 + t * 0.6, rr = r * (0.6 + 0.4 * Math.sin(i * 7.1))
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 1.2
    const s = 6 + 10 * Math.abs(Math.sin(t * 3 + i))
    fx.globalAlpha = 0.85; fx.fillStyle = '#FFFFFF'
    fx.beginPath(); fx.moveTo(x, y - s); fx.lineTo(x + s * 0.3, y - s * 0.3); fx.lineTo(x + s, y); fx.lineTo(x + s * 0.3, y + s * 0.3)
    fx.lineTo(x, y + s); fx.lineTo(x - s * 0.3, y + s * 0.3); fx.lineTo(x - s, y); fx.lineTo(x - s * 0.3, y - s * 0.3); fx.closePath(); fx.fill()
  }
  fx.globalAlpha = 1
}

// ── scènes ──
const FLAGS = ['🇲🇱', '🇯🇵', '🇧🇷', '🇫🇷', '🇪🇬', '🇮🇳', '🇲🇽', '🇰🇪', '🇨🇦', '🇦🇺', '🇰🇷', '🇸🇳', '🇨🇳', '🇮🇹', '🇵🇪', '🇲🇦', '🇩🇪', '🇹🇭']
const SC = [
  [0, 4, hook], [4, 9, intro], [9, 15, countries], [15, 24, stories], [24, 31, quiz],
  [31, 38, passport], [38, 45, levels], [45, 52, parents], [52, 60.2, cta],
]

function hook(t) {
  bg('#1E3A8A', '#3949AB', '#0D47A1', '#0A1638', t)
  buildText('hook', wordsHTML(TXT.hook, 150, 'white', 560))
  animWords(t, 0.15, 0.22, 0.55, 3.45)
  hideScreens(); setPhone({ op: 0 })
  backL.innerHTML = `<div class="abs" style="left:540px;top:1420px;transform:translate(-50%,-50%) scale(${back(prog(t, 1.6, 2.3))}) rotate(${Math.sin(t * 3) * 6}deg)"><span class="e" style="font-size:230px">🌍</span></div>`
  sparkles(t, 540, 1420, 260, 10)
}

function intro(t) {
  bg('#FFB74D', '#4FC3F7', '#FFF176', '#FFF3E0', t)
  buildText('intro', wordsHTML(TXT.s2, 120, '#1A2A4F', 150) + `<div class="abs" id="sub" style="left:60px;right:60px;top:440px;text-align:center;font-size:52px;font-weight:900;color:#E65100">${TXT.s2b}</div>`)
  animWords(t, 0.15, 0.1)
  $('sub').style.opacity = eo(prog(t, 1.0, 1.5)); $('sub').style.transform = `translateY(${(1 - eo(prog(t, 1.0, 1.5))) * 30}px)`
  const p = eo5(prog(t, 0.1, 1.2))
  setPhone({ y: lerp(1300, 140, p), rx: lerp(40, 8, p) + Math.sin(t) * 1.5, ry: lerp(-25, -10, p) + Math.sin(t * 0.8) * 3, rz: lerp(-8, 0, p), s: 0.92 })
  hideScreens(); screen('home', 1)
  backL.innerHTML = ''
}

function countries(t) {
  bg('#43C27A', '#1E88E5', '#A5D6A7', '#E8F5E9', t)
  const n = Math.round(COUNT * eo(prog(t, 0.2, 2.2)))
  buildText('countries', `<div class="abs hl" style="left:0;right:0;top:120px"><div id="cnt" style="font-size:260px;color:#1E8E57;line-height:1">0</div><div style="font-size:84px;color:#1A2A4F">${TXT.s3}</div><div id="s3b" style="font-family:Nunito;font-size:46px;font-weight:900;color:#2E7D32;margin-top:10px">${TXT.s3b}</div></div>`)
  $('cnt').textContent = n + (n >= COUNT ? '+' : '')
  $('s3b').style.opacity = eo(prog(t, 1.4, 1.9))
  const p = eo5(prog(t, 0, 0.8))
  setPhone({ y: lerp(240, 110, p), ry: lerp(-10, 12, eio(prog(t, 0, 6))), rx: 8, s: 0.8 })
  hideScreens()
  const scroll = eio(prog(t, 1.2, 5.6)) * 1700
  screen('regions_full', 1, { scroll })
  // drapeaux qui gravitent autour du téléphone
  let html = ''
  FLAGS.forEach((f, i) => {
    const a = (i / FLAGS.length) * Math.PI * 2 + t * 0.35
    const r = 470 + (i % 3) * 40
    const x = 540 + Math.cos(a) * r, y = 1230 + Math.sin(a) * r * 0.75
    const zf = Math.sin(a) > 0 ? 1 : 0
    const sc = back(prog(t, 0.3 + i * 0.06, 0.8 + i * 0.06)) * (0.75 + 0.35 * zf)
    html += `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${sc});z-index:${zf}"><span class="e" style="font-size:100px;filter:drop-shadow(0 10px 14px rgba(0,0,0,0.2))">${f}</span></div>`
  })
  backL.innerHTML = html
}

function stories(t) {
  bg('#FFCC80', '#FF8A65', '#FFE082', '#FFF3E0', t)
  buildText('stories', wordsHTML(TXT.s4, 130, '#1A2A4F', 110) + `<div class="abs" id="voice" style="left:0;right:0;top:420px;text-align:center"><span class="chip" style="background:#1E88E5;color:white"><span class="e" style="font-size:56px">🔊</span>${TXT.s4b}<span id="bars" style="display:inline-flex;gap:6px;align-items:center;height:50px"></span></span></div>`)
  animWords(t, 0.15, 0.12)
  const v = back(prog(t, 0.9, 1.4)); $('voice').style.transform = `scale(${v})`
  $('bars').innerHTML = [0, 1, 2, 3, 4].map((i) => `<i style="display:block;width:8px;border-radius:4px;background:white;height:${12 + 30 * Math.abs(Math.sin(t * 9 + i * 1.3))}px"></i>`).join('')
  setPhone({ y: 120, ry: lerp(10, -10, eio(prog(t, 0, 9))), rx: 6 + Math.sin(t) * 1.5, s: 0.8 })
  hideScreens()
  // pays -> intro -> carte 1 -> carte 2 (glissements)
  const seq = [['country', 0], ['intro', 2.0], ['card1_open', 4.3], ['card2_open', 6.6]]
  seq.forEach(([n, a], i) => {
    const nextA = seq[i + 1]?.[1] ?? 99
    const pin = eo5(prog(t, a, a + 0.45)), pout = eio(prog(t, nextA, nextA + 0.45))
    if (t < a || pout >= 1) return
    screen(n, 1, { dx: (1 - pin) * 556 * (i ? 1 : 0) - pout * 556 * 0.35 })
  })
  backL.innerHTML = ''
}

function quiz(t) {
  bg('#9575CD', '#4FC3F7', '#F48FB1', '#EDE7F6', t)
  buildText('quiz', wordsHTML(TXT.s5, 120, '#311B92', 110))
  animWords(t, 0.15, 0.1)
  setPhone({ y: 90, ry: lerp(-8, 8, eio(prog(t, 0, 7))), rx: 6, s: 0.78 })
  hideScreens()
  const tapT = 2.5, resT = 4.4
  if (t < tapT) screen('quiz', 1)
  else if (t < resT) screen('quiz_ok', 1)
  else screen('result', 1, { s: lerp(0.9, 1, eo5(prog(t, resT, resT + 0.5))) })
  // anneau de toucher sur la bonne réponse
  const tp = prog(t, tapT - 0.25, tapT + 0.45)
  if (tp > 0 && tp < 1) {
    tap.style.opacity = tp < 0.35 ? tp / 0.35 : 1 - (tp - 0.35) / 0.65
    tap.style.left = '170px'; tap.style.top = `${0.424 * 1254}px`
    tap.style.transform = `scale(${tp < 0.35 ? 1 - tp : 0.65 + (tp - 0.35) * 1.4})`
  }
  confetti(t, tapT + 0.05, 540, 1100, 80, 1)
  confetti(t, resT + 0.1, 540, 900, 110, 1.2)
  const xp = back(prog(t, resT + 0.4, resT + 0.9))
  backL.innerHTML = ''
  front.querySelector('#xp')?.remove()
  if (xp > 0) front.insertAdjacentHTML('beforeend', `<div id="xp" class="abs" style="left:540px;top:1830px;transform:translate(-50%,-50%) scale(${xp})"><span class="chip" style="background:linear-gradient(135deg,#FFD54F,#FF9800);color:white;font-size:64px;padding:24px 50px;box-shadow:0 20px 40px rgba(255,152,0,0.45)"><span class="e" style="font-size:70px">⭐</span>${TXT.s5b}</span></div>`)
}

function passport(t) {
  bg('#5C6BC0', '#26C6DA', '#FFD54F', '#E8EAF6', t)
  buildText('passport', wordsHTML(TXT.s6, 120, '#1A237E', 110) + `<div class="abs" id="s6b" style="left:0;right:0;top:390px;text-align:center;font-size:50px;font-weight:900;color:#3949AB">${TXT.s6b}</div>`)
  animWords(t, 0.15, 0.1)
  $('s6b').style.opacity = eo(prog(t, 0.9, 1.4))
  setPhone({ x: lerp(0, -130, eio(prog(t, 2.0, 2.8))), y: 130, ry: lerp(14, 18, eio(prog(t, 0, 7))), rx: 6, s: 0.78 })
  hideScreens()
  if (t < 2.2) screen('map', 1)
  else screen('passport_full', 1, { scroll: eio(prog(t, 3.0, 6.5)) * 520, dx: (1 - eo5(prog(t, 2.2, 2.65))) * 556 })
  // tampons qui claquent à droite du téléphone
  const st = [['🇲🇱', '#E65100', -10], ['🇯🇵', '#C62828', 8], ['🇧🇷', '#2E7D32', -6], ['🇫🇷', '#1565C0', 10]]
  let html = ''
  st.forEach(([f, c, r], i) => {
    const t0 = 2.6 + i * 0.5, p = prog(t, t0, t0 + 0.18)
    if (p <= 0) return
    const s = lerp(2.4, 1, eo(p)), y = 720 + i * 300
    html += `<div class="abs" style="left:870px;top:${y}px;transform:translate(-50%,-50%) rotate(${r}deg) scale(${s});opacity:${clamp(p * 3)};width:230px;height:230px;border-radius:50%;border:12px solid ${c};background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(0,0,0,0.18)"><span class="e" style="font-size:110px">${f}</span></div>`
  })
  front.querySelector('#stamps')?.remove()
  front.insertAdjacentHTML('beforeend', `<div id="stamps">${html}</div>`)
  backL.innerHTML = ''
}

function levels(t) {
  const games = t >= 3.5
  bg(games ? '#FF7043' : '#4FC3F7', games ? '#FFCA28' : '#BA68C8', games ? '#EC407A' : '#81C784', games ? '#FFF3E0' : '#E3F2FD', t)
  if (!games) { buildText('levels', wordsHTML(TXT.s7, 112, '#0D47A1', 110)); animWords(t, 0.15, 0.1) }
  else { buildText('games', wordsHTML(TXT.s7b, 140, '#BF360C', 120)); animWords(t, 3.6, 0.12) }
  setPhone({ x: games ? 0 : lerp(0, -130, eio(prog(t, 0.7, 1.3))), y: 130, ry: games ? lerp(-12, 6, eio(prog(t, 3.5, 7))) : lerp(14, 18, eio(prog(t, 0, 3.5))), rx: 6, s: 0.8 })
  hideScreens()
  if (!games) screen('levels', 1)
  else screen('games', 1, { dx: (1 - eo5(prog(t, 3.5, 3.95))) * 556 })
  let html = ''
  if (!games) {
    ;[['🐣', '#FFA000', -1], ['🦊', '#1E88E5', 0], ['🦉', '#7B1FA2', 1]].forEach(([e, c, k], i) => {
      const p = back(prog(t, 1.0 + i * 0.25, 1.5 + i * 0.25))
      html += `<div class="abs" style="left:880px;top:${1000 + k * 330}px;transform:translate(-50%,-50%) scale(${p})"><div style="width:190px;height:190px;border-radius:60px;background:white;border:8px solid ${c};display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(0,0,0,0.15)"><span class="e" style="font-size:120px">${e}</span></div></div>`
    })
  } else {
    ;['🧭', '🧩', '🦁', '🏛️'].forEach((e, i) => {
      const p = back(prog(t, 4.2 + i * 0.18, 4.7 + i * 0.18))
      const x = [150, 930, 130, 950][i], y = [700, 760, 1500, 1450][i]
      html += `<div class="abs" style="left:${x}px;top:${y + Math.sin(t * 3 + i) * 14}px;transform:translate(-50%,-50%) scale(${p}) rotate(${Math.sin(t * 2 + i) * 10}deg)"><span class="e" style="font-size:150px;filter:drop-shadow(0 14px 20px rgba(0,0,0,0.2))">${e}</span></div>`
    })
  }
  backL.innerHTML = games ? html : ''
  front.querySelector('#lv')?.remove()
  if (!games) front.insertAdjacentHTML('beforeend', `<div id="lv">${html}</div>`)
}

function parents(t) {
  bg('#80CBC4', '#90CAF9', '#FFF59D', '#F1F8FF', t)
  let cards = ''
  TXT.badges.forEach(([e, label], i) => {
    const p = back(prog(t, 0.6 + i * 0.4, 1.1 + i * 0.4))
    const y = 720 + i * 270
    cards += `<div class="abs card" style="left:540px;top:${y}px;width:860px;height:220px;transform:translate(-50%,0) scale(${p});display:flex;align-items:center;gap:40px;padding:0 50px">
      <div style="width:140px;height:140px;border-radius:44px;background:#E8F5E9;display:flex;align-items:center;justify-content:center"><span class="e" style="font-size:90px">${e}</span></div>
      <div class="hl" style="font-size:62px;text-align:left;color:#1A2A4F;letter-spacing:0">${label}</div>
      <div style="margin-left:auto;width:80px;height:80px;border-radius:50%;background:#2E9E5B;color:white;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:scale(${back(prog(t, 0.9 + i * 0.4, 1.3 + i * 0.4))})">✓</div></div>`
  })
  buildText('parents', wordsHTML(TXT.s8, 120, '#004D40', 150) + '<div id="pc"></div>')
  animWords(t, 0.15, 0.1)
  $('pc').innerHTML = cards
  hideScreens(); setPhone({ y: 1600, op: 0 })
  backL.innerHTML = ''
}

function cta(t) {
  bg('#FFB300', '#FF7043', '#42A5F5', '#1E88E5', t)
  const p = eo5(prog(t, 0, 1.0))
  setPhone({ y: lerp(900, -230, p), ry: Math.sin(t * 0.9) * 6, rx: lerp(30, 6, p), s: 0.56 })
  hideScreens(); screen('home', 1)
  const btn = back(prog(t, 1.0, 1.5)) * (1 + Math.sin(t * Math.PI * 2) * 0.03 * (t > 1.6 ? 1 : 0))
  buildText('cta', `
    <div class="abs" id="logo" style="left:0;right:0;top:90px;text-align:center"><span style="display:inline-block;background:white;border-radius:70px;padding:22px 64px;box-shadow:0 20px 50px rgba(0,0,0,0.2)"><span class="hl" style="font-size:150px;letter-spacing:1px"><span style="color:#FF7A00">Moka</span><span style="color:#1E88E5">libo</span></span></span></div>
    <div class="abs" id="btn" style="left:540px;top:1470px;transform:translate(-50%,-50%);white-space:nowrap;background:linear-gradient(180deg,#FFE04D,#FFC400);border-radius:80px;padding:44px 84px;box-shadow:0 16px 0 #E6A100,0 34px 60px rgba(0,0,0,0.3)"><span class="hl" style="font-size:84px;color:#1A2A4F;letter-spacing:0">${TXT.cta}</span></div>
    <div class="abs hl" id="url" style="left:0;right:0;top:1610px;font-size:96px;color:white;letter-spacing:0;text-shadow:0 6px 20px rgba(0,0,0,0.25)">mokalibo.com</div>
    <div class="abs" id="ctasub" style="left:60px;right:60px;top:1760px;text-align:center;font-size:36px;font-weight:900;color:#E3F2FD">${TXT.ctaSub}</div>`)
  $('logo').style.transform = `scale(${back(prog(t, 0.3, 0.9))})`
  $('btn').style.transform = `translate(-50%,-50%) scale(${btn})`
  $('url').style.opacity = eo(prog(t, 1.6, 2.1)); $('url').style.transform = `translateY(${(1 - eo(prog(t, 1.6, 2.1))) * 30}px)`
  $('ctasub').style.opacity = eo(prog(t, 2.2, 2.7))
  confetti(t, 0.15, 540, 700, 120, 1.3)
  sparkles(t, 540, 880, 470, 12)
  backL.innerHTML = ''
}

// ── rendu d'une image ──
let curScene = -1
window.render = function (t) {
  fx.clearRect(0, 0, 1080, 1920)
  for (let i = 0; i < SC.length; i++) {
    const [a, b, fn] = SC[i]
    if (t >= a && t < b) {
      if (i !== curScene) { curScene = i; builtKey = null; front.innerHTML = ''; backL.innerHTML = '' }
      const lt = t - a
      fn(lt)
      // transition d'entrée : zoom + flou + éclair
      const tr = prog(lt, 0, 0.32)
      const root = $('root')
      root.style.transform = i ? `scale(${lerp(1.12, 1, eo5(tr))})` : 'none'
      root.style.filter = i && tr < 1 ? `blur(${(1 - eo(tr)) * 14}px)` : 'none'
      $('flash').style.opacity = i ? (1 - eo(tr)) * 0.55 : 0
      // sortie : léger zoom avant la coupe
      if (b - t < 0.18 && i < SC.length - 1) { root.style.transform = `scale(${1 + (0.18 - (b - t)) * 0.4})`; root.style.filter = `blur(${(0.18 - (b - t)) * 50}px)` }
    }
  }
}
window.ready = async function () {
  await document.fonts.ready
  await Promise.all(Object.values(IMG).map((im) => im.decode().catch(() => {})))
  const probe = document.createElement('div'); probe.style.cssText = 'position:absolute;left:-9999px'
  probe.textContent = FLAGS.join('') + '🌍🔊⭐🚫🔒⏱️👨‍👩‍👧‍👦🐣🦊🦉🧭🧩🦁🏛️'
  document.body.appendChild(probe)
  await document.fonts.load('100px "Noto Color Emoji"', probe.textContent)
  await document.fonts.load('700 100px Fredoka'); await document.fonts.load('900 100px Nunito')
  return true
}
render(0)
