<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B1E4A; }
  body { font-family: 'Nunito', 'Noto Color Emoji', sans-serif; color: #1A2A4F; }
  .e { font-family: 'Noto Color Emoji'; line-height: 1; display: inline-block; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .center { left: 50%; top: 50%; }
  .title { font-family: 'Fredoka', sans-serif; font-weight: 700; }
  .card { background: white; border-radius: 48px; box-shadow: 0 30px 60px rgba(10,30,80,0.25); }
  .pill { border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ── Textes ───────────────────────────────────────────────
const TXT = {
  fr: {
    hook: '« Papa, c’est où<br>le Mali ? »',
    hook2: 'Une question d’enfant…',
    tag: 'L’histoire du monde,<br>racontée aux enfants',
    countries: 'pays à explorer',
    stories: 'Des histoires vraies', voice: 'lues à voix haute',
    cards: [
      ['👑', '🇲🇱', 'Mansa Moussa', 'Le roi le plus riche de toute l’histoire'],
      ['🏯', '🇯🇵', 'Les samouraïs', 'Des guerriers qui suivaient un code d’honneur'],
      ['🔺', '🇪🇬', 'Les pyramides', 'Construites il y a plus de 4 500 ans'],
    ],
    quiz_t: 'Quiz !', quiz_q: 'Quel animal vit en Australie ?',
    quiz_a: [['🦘', 'Le kangourou'], ['🐧', 'Le pingouin'], ['🐫', 'Le chameau']],
    bravo: 'Bravo !', passport: 'Remplis ton passeport !', badge: 'Grand voyageur',
    feats: [['🔊', 'Voix off'], ['📚', '3 niveaux · 4-12 ans'], ['🗺️', 'Carte du monde'], ['🎮', 'Jeux et badges']],
    cta: 'Essaie gratuitement !', cta_sub: 'Sans pub · Sans compte · 2 histoires offertes par jour',
  },
  en: {
    hook: '“Dad, where<br>is Mali?”',
    hook2: 'A child’s question…',
    tag: 'World history,<br>told for kids',
    countries: 'countries to explore',
    stories: 'True stories', voice: 'read aloud',
    cards: [
      ['👑', '🇲🇱', 'Mansa Musa', 'The richest king in all of history'],
      ['🏯', '🇯🇵', 'The samurai', 'Warriors who followed a code of honour'],
      ['🔺', '🇪🇬', 'The pyramids', 'Built more than 4,500 years ago'],
    ],
    quiz_t: 'Quiz!', quiz_q: 'Which animal lives in Australia?',
    quiz_a: [['🦘', 'The kangaroo'], ['🐧', 'The penguin'], ['🐫', 'The camel']],
    bravo: 'Well done!', passport: 'Fill your passport!', badge: 'Great traveller',
    feats: [['🔊', 'Voice-over'], ['📚', '3 levels · ages 4-12'], ['🗺️', 'World map'], ['🎮', 'Games & badges']],
    cta: 'Try it for free!', cta_sub: 'No ads · No account · 2 free stories every day',
  },
  de: {
    hook: '„Papa, wo liegt<br>eigentlich Mali?“',
    hook2: 'Eine Kinderfrage…',
    tag: 'Weltgeschichte,<br>für Kinder erzählt',
    countries: 'Länder zum Entdecken',
    stories: 'Wahre Geschichten', voice: 'vorgelesen',
    cards: [
      ['👑', '🇲🇱', 'Mansa Musa', 'Der reichste König der Geschichte'],
      ['🏯', '🇯🇵', 'Die Samurai', 'Krieger mit einem Ehrenkodex'],
      ['🔺', '🇪🇬', 'Die Pyramiden', 'Über 4.500 Jahre alt'],
    ],
    quiz_t: 'Quiz!', quiz_q: 'Welches Tier lebt in Australien?',
    quiz_a: [['🦘', 'Das Känguru'], ['🐧', 'Der Pinguin'], ['🐫', 'Das Kamel']],
    bravo: 'Super!', passport: 'Füll deinen Reisepass!', badge: 'Großer Reisender',
    feats: [['🔊', 'Vorlesestimme'], ['📚', '3 Stufen · 4-12 Jahre'], ['🗺️', 'Weltkarte'], ['🎮', 'Spiele & Abzeichen']],
    cta: 'Jetzt gratis testen!', cta_sub: 'Ohne Werbung · Ohne Konto · 2 Geschichten gratis pro Tag',
  },
}
const LANG = new URLSearchParams(location.search).get('lang') || 'fr'
const T = TXT[LANG]

// ── Outils d'animation (déterministes : tout dépend du temps t) ──
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const easeOut = (x) => 1 - Math.pow(1 - x, 3)
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const pop = (t, a, d = 0.45) => backOut(prog(t, a, a + d))
const fade = (t, a, d = 0.3) => easeOut(prog(t, a, a + d))
const BEAT = 0.5

const FLAGS = '🇲🇱 🇸🇳 🇲🇦 🇳🇬 🇪🇬 🇰🇪 🇿🇦 🇪🇹 🇫🇷 🇩🇪 🇬🇧 🇮🇹 🇪🇸 🇵🇹 🇬🇷 🇸🇪 🇯🇵 🇨🇳 🇮🇳 🇰🇷 🇹🇭 🇻🇳 🇮🇩 🇹🇷 🇧🇷 🇲🇽 🇦🇷 🇵🇪 🇨🇦 🇺🇸 🇨🇴 🇨🇱 🇦🇺 🇳🇿 🇫🇯 🇨🇺 🇬🇭 🇨🇮 🇨🇲 🇹🇳 🇩🇿 🇵🇰 🇮🇷 🇸🇦 🇳🇵 🇲🇳 🇵🇭 🇺🇦'.split(' ')

function bg(top, bottom) { return `<div class="abs" style="inset:0;background:linear-gradient(180deg,${top},${bottom})"></div>` }

function stars(t, n = 40, seed = 3) {
  let s = ''
  for (let i = 0; i < n; i++) {
    const x = (i * 263 + seed * 97) % 1080, y = (i * 571 + seed * 31) % 1920
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + i))
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:${4 + (i % 3) * 2}px;height:${4 + (i % 3) * 2}px;border-radius:50%;background:white;opacity:${tw * 0.8}"></div>`
  }
  return s
}

function confetti(t, t0, n = 60, cx = 540, cy = 760) {
  const p = t - t0
  if (p < 0 || p > 2.4) return ''
  const cols = ['#FFC400', '#FF6F00', '#1E88E5', '#43C27A', '#E91E63', '#7E57C2']
  let s = ''
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + i
    const v = 700 + (i * 37) % 600
    const x = cx + Math.cos(ang) * v * p
    const y = cy + Math.sin(ang) * v * p * 0.8 + 900 * p * p
    const rot = (i * 47 + p * 600) % 360
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:22px;height:12px;background:${cols[i % cols.length]};transform:rotate(${rot}deg);opacity:${1 - p / 2.4};border-radius:3px"></div>`
  }
  return s
}

function logo(size = 150) {
  return `<span class="title" style="font-size:${size}px;letter-spacing:2px"><span style="color:#FF7A00">Moka</span><span style="color:#1E88E5">libo</span></span>`
}

// ── Scènes (en secondes, calées sur la musique à 120 BPM : 1 mesure = 2 s) ──
const SCENES = [
  [0, 6, sceneHook],
  [6, 12, sceneLogo],
  [12, 20, sceneFlags],
  [20, 30, sceneStories],
  [30, 38, sceneQuiz],
  [38, 46, scenePassport],
  [46, 52, sceneFeatures],
  [52, 60.1, sceneCTA],
]

function sceneHook(t) {
  const g = pop(t, 0.1, 0.9)
  const rot = 0
  const bubble = pop(t, 1.0, 0.5)
  const pin = pop(t, 3.6, 0.5)
  const sub = fade(t, 4.2)
  return bg('#0B1E4A', '#1E4FA8') + stars(t) + `
    <div class="abs" style="left:540px;top:820px;transform:translate(-50%,-50%) scale(${g}) rotate(${rot}deg)"><span class="e" style="font-size:520px;filter:drop-shadow(0 30px 60px rgba(0,0,0,0.4))">🌍</span></div>
    <div class="abs" style="left:420px;top:880px;transform:translate(-50%,-100%) scale(${pin})"><span class="e" style="font-size:130px">📍</span></div>
    <div class="abs" style="left:420px;top:745px;transform:translate(-50%,-100%) scale(${pin});"><span class="e" style="font-size:110px">🇲🇱</span></div>
    <div class="abs card" style="left:540px;top:1330px;transform:translate(-50%,0) scale(${bubble});transform-origin:15% 0;padding:44px 56px;text-align:center;width:900px">
      <div class="title" style="font-size:84px;line-height:1.1;color:#1A2A4F">${T.hook}</div>
    </div>
    <div class="abs" style="left:150px;top:1240px;transform:scale(${bubble})"><span class="e" style="font-size:150px">👦🏾</span></div>
    <div class="abs" style="left:0;right:0;top:1660px;text-align:center;opacity:${sub};font-size:54px;font-weight:900;color:#FFD54F">${T.hook2}</div>`
}

function sceneLogo(t) {
  const letters = ['M', 'o', 'k', 'a', 'l', 'i', 'b', 'o']
  let L = ''
  letters.forEach((ch, i) => {
    const p = pop(t, 0.15 + i * 0.12, 0.5)
    const bounce = Math.abs(Math.sin((t - 2 - i * 0.15) * 3)) * (t > 2 ? 14 : 0)
    L += `<span style="display:inline-block;transform:translateY(${(1 - p) * 200 - bounce}px) scale(${p});color:${i < 4 ? '#FF7A00' : '#1E88E5'}">${ch}</span>`
  })
  const tag = fade(t, 1.6, 0.5)
  const globe = pop(t, 0, 0.6)
  return bg('#E3F4FF', '#FFF6DC') + confetti(t, 1.2, 70, 540, 900) + `
    <div class="abs" style="left:540px;top:560px;transform:translate(-50%,-50%) scale(${globe}) rotate(${Math.sin(t * 2) * 8}deg)"><span class="e" style="font-size:300px">🌍</span></div>
    <div class="abs title" style="left:0;right:0;top:820px;text-align:center;font-size:190px;letter-spacing:4px;text-shadow:0 10px 0 rgba(0,0,0,0.06)">${L}</div>
    <div class="abs title" style="left:0;right:0;top:1120px;text-align:center;font-size:76px;line-height:1.15;color:#1A2A4F;opacity:${tag};transform:translateY(${(1 - tag) * 40}px)">${T.tag}</div>`
}

function sceneFlags(t) {
  const cols = 6, size = 150, gap = 18
  const w = cols * size + (cols - 1) * gap
  let s = ''
  FLAGS.forEach((f, i) => {
    const r = Math.floor(i / cols), c = i % cols
    const p = pop(t, 0.2 + i * 0.07, 0.4)
    const x = (1080 - w) / 2 + c * (size + gap), y = 560 + r * (size + gap * 0.6)
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:${size}px;height:${size * 0.8}px;transform:scale(${p});display:flex;align-items:center;justify-content:center"><span class="e" style="font-size:110px">${f}</span></div>`
  })
  const n = Math.round(150 * easeOut(prog(t, 0.2, 4)))
  const head = pop(t, 0, 0.5)
  return bg('#43C27A', '#1E8E57') + s + `
    <div class="abs" style="left:0;right:0;top:170px;text-align:center;transform:scale(${head})">
      <div class="title" style="font-size:230px;color:white;line-height:1;text-shadow:0 12px 0 rgba(0,0,0,0.15)">${n}${n >= 150 ? '+' : ''}</div>
      <div class="title" style="font-size:74px;color:#FFF6C2">${T.countries}</div>
    </div>`
}

function sceneStories(t) {
  const head = fade(t, 0, 0.4)
  let s = ''
  T.cards.forEach(([emoji, flag, title, text], i) => {
    const t0 = 0.5 + i * 3.1
    const pin = easeOut(prog(t, t0, t0 + 0.5))
    const out = i < 2 ? easeInOut(prog(t, t0 + 2.7, t0 + 3.2)) : 0
    const x = 540 + (1 - pin) * 1100 - out * 1100
    const rot = (1 - pin) * 12 - out * 12
    if (pin <= 0 || out >= 1) return
    const wob = Math.sin((t - t0) * 2.4) * 2
    s += `<div class="abs card" style="left:${x}px;top:1040px;width:820px;transform:translate(-50%,-50%) rotate(${rot + wob}deg);padding:60px 56px;text-align:center">
      <div style="position:absolute;top:-50px;right:50px"><span class="e" style="font-size:120px">${flag}</span></div>
      <div style="width:260px;height:260px;margin:0 auto 30px;border-radius:60px;background:#FFF3E0;display:flex;align-items:center;justify-content:center"><span class="e" style="font-size:180px">${emoji}</span></div>
      <div class="title" style="font-size:88px;color:#E65100">${title}</div>
      <div style="font-size:52px;font-weight:800;color:#455A64;line-height:1.3;margin-top:16px">${text}</div>
    </div>`
  })
  const wave = 1 + Math.sin(t * 8) * 0.06
  return bg('#FFE7C2', '#FFC48A') + `
    <div class="abs" style="left:0;right:0;top:170px;text-align:center;opacity:${head}">
      <div class="title" style="font-size:96px;color:#1A2A4F">${T.stories}</div>
      <div style="display:inline-flex;align-items:center;gap:20px;margin-top:20px;background:white;border-radius:999px;padding:16px 40px;font-size:52px;font-weight:900;color:#1E88E5">
        <span class="e" style="font-size:64px;transform:scale(${wave})">🔊</span>${T.voice}</div>
    </div>` + s
}

function sceneQuiz(t) {
  const head = pop(t, 0, 0.5)
  const q = fade(t, 0.4, 0.4)
  const tapT = 3.4
  let s = ''
  T.quiz_a.forEach(([emoji, label], i) => {
    const p = pop(t, 0.8 + i * 0.25, 0.45)
    const good = i === 0 && t > tapT
    const press = i === 0 ? 1 - 0.06 * Math.sin(Math.PI * prog(t, tapT - 0.15, tapT + 0.15)) : 1
    const dim = !good && t > tapT + 0.3 ? 0.45 : 1
    s += `<div class="abs card" style="left:540px;top:${900 + i * 230}px;width:860px;height:190px;transform:translate(-50%,0) scale(${p * press});opacity:${dim};display:flex;align-items:center;gap:36px;padding:0 50px;background:${good ? '#43C27A' : 'white'};color:${good ? 'white' : '#1A2A4F'}">
      <span class="e" style="font-size:120px">${emoji}</span><span class="title" style="font-size:72px">${label}</span>
      ${good ? '<span style="margin-left:auto;font-size:90px;font-weight:900">✓</span>' : ''}</div>`
  })
  const hand = prog(t, 2.4, tapT)
  const hx = 740 - (1 - easeInOut(hand)) * 220, hy = 1040 + (1 - easeInOut(hand)) * 520
  const handOp = t > 2.4 && t < tapT + 0.9 ? 1 : 0
  const bravo = pop(t, tapT + 0.35, 0.5)
  const xp = prog(t, tapT + 0.5, tapT + 2.2)
  return bg('#7E57C2', '#4527A0') + stars(t, 25, 9) + confetti(t, tapT + 0.1, 70, 540, 1000) + `
    <div class="abs title" style="left:0;right:0;top:200px;text-align:center;font-size:140px;color:#FFD54F;transform:scale(${head})">${T.quiz_t}</div>
    <div class="abs title" style="left:90px;right:90px;top:430px;text-align:center;font-size:84px;line-height:1.15;color:white;opacity:${q}">${T.quiz_q}</div>
    ${s}
    <div class="abs" style="left:${hx}px;top:${hy}px;opacity:${handOp}"><span class="e" style="font-size:150px">👆</span></div>
    <div class="abs title" style="left:0;right:0;top:1600px;text-align:center;font-size:110px;color:#FFD54F;transform:scale(${bravo})">${T.bravo} <span class="e" style="font-size:100px">⭐</span></div>
    <div class="abs title" style="left:0;right:0;top:${760 - xp * 140}px;text-align:center;font-size:90px;color:white;opacity:${xp > 0 ? 1 - xp * 0.8 : 0}">+30 XP</div>`
}

function scenePassport(t) {
  const head = fade(t, 0, 0.4)
  const book = pop(t, 0.2, 0.6)
  const stamps = [['🇲🇱', -12], ['🇯🇵', 9], ['🇧🇷', -6], ['🇫🇷', 12], ['🇦🇺', -9], ['🇰🇪', 6]]
  const colors = ['#E65100', '#C62828', '#2E7D32', '#1565C0', '#6A1B9A', '#00838F']
  let s = ''
  stamps.forEach(([f, r], i) => {
    const t0 = 0.9 + i * 0.5
    const p = prog(t, t0, t0 + 0.22)
    if (p <= 0) return
    const sc = 2.2 - 1.2 * easeOut(p)
    const x = 250 + (i % 3) * 290, y = 760 + Math.floor(i / 3) * 330
    s += `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${r}deg) scale(${sc});opacity:${clamp(p * 2)};width:240px;height:240px;border-radius:50%;border:12px solid ${colors[i]};display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.6)"><span class="e" style="font-size:120px">${f}</span></div>`
  })
  const badge = pop(t, 4.4, 0.6)
  const shine = (t * 90) % 360
  return bg('#1E3A8A', '#0B1E4A') + stars(t, 30, 5) + `
    <div class="abs title" style="left:0;right:0;top:190px;text-align:center;font-size:92px;color:white;opacity:${head}">${T.passport}</div>
    <div class="abs" style="left:540px;top:1000px;width:900px;height:820px;transform:translate(-50%,-50%) scale(${book});background:#FFF8E7;border-radius:40px;box-shadow:0 40px 80px rgba(0,0,0,0.4);border:10px solid #C9A227"></div>
    ${s}
    <div class="abs" style="left:540px;top:1610px;transform:translate(-50%,-50%) scale(${badge});display:flex;align-items:center;gap:24px;background:linear-gradient(135deg,#FFD54F,#FF9800);border-radius:999px;padding:26px 56px;box-shadow:0 20px 40px rgba(255,152,0,0.5)">
      <span class="e" style="font-size:110px;transform:rotate(${Math.sin(shine / 30) * 10}deg)">🏅</span><span class="title" style="font-size:68px;color:white;white-space:nowrap">${T.badge}</span></div>`
}

function sceneFeatures(t) {
  const cols = ['#FF7A00', '#1E88E5', '#00ACC1', '#E91E63']
  let s = ''
  T.feats.forEach(([emoji, label], i) => {
    const p = pop(t, 0.2 + i * 0.35, 0.5)
    const x = i % 2 ? 790 : 290, y = 640 + Math.floor(i / 2) * 560
    const bob = Math.sin(t * 3 + i) * 10
    s += `<div class="abs" style="left:${x}px;top:${y + bob}px;width:440px;height:480px;transform:translate(-50%,0) scale(${p});border-radius:56px;background:${cols[i]};box-shadow:0 14px 0 rgba(0,0,0,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px;text-align:center">
      <span class="e" style="font-size:180px">${emoji}</span><span class="title" style="font-size:56px;color:white;line-height:1.1">${label}</span></div>`
  })
  return bg('#FFF6DC', '#E3F4FF') + `<div class="abs" style="left:0;right:0;top:230px;text-align:center;transform:scale(${pop(t, 0, 0.5)})">${logo(150)}</div>` + s
}

function sceneCTA(t) {
  const g = pop(t, 0, 0.6)
  const pulse = 1 + Math.sin(t * Math.PI * 2) * 0.04
  const btn = pop(t, 0.8, 0.5)
  const url = fade(t, 1.4, 0.4)
  const sub = fade(t, 2, 0.4)
  return bg('#1E88E5', '#0B3D91') + stars(t, 30, 11) + confetti(t, 0.3, 80, 540, 600) + `
    <div class="abs" style="left:540px;top:520px;transform:translate(-50%,-50%) scale(${g}) rotate(${Math.sin(t * 2) * 8}deg)"><span class="e" style="font-size:360px">🌍</span></div>
    <div class="abs" style="left:0;right:0;top:800px;text-align:center;transform:scale(${g})"><div style="display:inline-block;background:white;border-radius:60px;padding:20px 60px">${logo(140)}</div></div>
    <div class="abs" style="left:540px;top:1170px;transform:translate(-50%,-50%) scale(${btn * pulse});background:linear-gradient(180deg,#FFE04D,#FFC400);border-radius:70px;padding:44px 80px;box-shadow:0 16px 0 #E6A100, 0 30px 60px rgba(0,0,0,0.3);white-space:nowrap">
      <span class="title" style="font-size:88px;color:#1A2A4F">${T.cta}</span></div>
    <div class="abs title" style="left:0;right:0;top:1380px;text-align:center;font-size:110px;color:white;opacity:${url}">mokalibo.com</div>
    <div class="abs" style="left:80px;right:80px;top:1560px;text-align:center;font-size:48px;font-weight:900;color:#BBDEFB;line-height:1.35;opacity:${sub}">${T.cta_sub}</div>`
}

// Transition : petit zoom + fondu au début de chaque scène
window.render = function (t) {
  let html = ''
  for (const [a, b, fn] of SCENES) {
    if (t >= a && t < b) {
      const local = t - a
      const inP = easeOut(prog(local, 0, 0.35))
      html = `<div class="abs" style="inset:0;opacity:${inP};transform:scale(${1.06 - 0.06 * inP})">${fn(local)}</div>`
    }
  }
  document.getElementById('stage').innerHTML = html
}
window.fontsReady = async function () {
  await document.fonts.ready
  const probe = document.createElement('div')
  probe.style.cssText = 'position:absolute;left:-9999px;font-family:Noto Color Emoji'
