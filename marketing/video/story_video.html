<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=block" rel="stylesheet">
<link href="noto-emoji.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Nunito', sans-serif; -webkit-font-smoothing: antialiased; color: #1A2A4F; }
  .e { font-family: 'Noto Color Emoji'; line-height: 1; }
  .fr { font-family: 'Fredoka', sans-serif; font-weight: 700; }
  #bg { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  /* 1 — accroche */
  .row { position: absolute; left: 0; white-space: nowrap; font-size: 120px; }
  #hook { position: absolute; left: 60px; right: 60px; top: 760px; text-align: center; font-size: 104px; line-height: 1.05; color: #fff; text-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #hook .w { display: inline-block; opacity: 0; }
  /* 2 — telephone */
  #cap { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 22px 46px; font-size: 62px; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
  #phone { position: absolute; left: 270px; top: 430px; width: 540px; height: 1168px; border-radius: 76px; background: #111318; padding: 16px; box-shadow: 0 50px 90px rgba(0,0,0,.35); }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 62px; overflow: hidden; background: #FFF8EC; }
  #screen img { position: absolute; left: 0; top: 0; width: 100%; will-change: transform, opacity; }
  #island { position: absolute; left: 50%; top: 30px; width: 150px; height: 42px; margin-left: -75px; border-radius: 24px; background: #000; z-index: 3; }
  .side { position: absolute; font-size: 120px; }
  /* 3 — fin */
  #globe { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); font-size: 200px; }
  #logo { position: absolute; left: 50%; top: 560px; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 24px 80px 32px; font-size: 150px; white-space: nowrap; box-shadow: 0 24px 50px rgba(0,0,0,.25); }
  #tag { position: absolute; left: 0; right: 0; top: 860px; text-align: center; color: #fff; font-size: 76px; line-height: 1.12; text-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #offer { position: absolute; left: 50%; top: 1100px; transform: translateX(-50%); background: #FFD600; border-radius: 40px; padding: 30px 60px; font-size: 90px; white-space: nowrap; box-shadow: 0 14px 0 #E6A100, 0 30px 50px rgba(0,0,0,.25); }
  #small { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; color: #fff; font-size: 48px; font-weight: 900; }
</style>
</head>
<body>
<div id="bg"></div>

<div class="layer" id="L1">
  <div class="row e" id="r1"></div><div class="row e" id="r2"></div><div class="row e" id="r3"></div><div class="row e" id="r4"></div>
  <div id="hook" class="fr"></div>
</div>

<div class="layer" id="L2">
  <div id="cap" class="fr"></div>
  <span class="side e" style="left:60px;top:900px">✈️</span>
  <span class="side e" style="left:880px;top:1250px">⭐</span>
  <div id="phone"><div id="screen"><div id="island"></div></div></div>
</div>

<div class="layer" id="L3">
  <div id="globe" class="e">🌍</div>
  <div id="logo" class="fr"><span style="color:#FF7A00">Moka</span><span style="color:#1E88E5">libo</span></div>
  <div id="tag" class="fr"></div>
  <div id="offer" class="fr"></div>
  <div id="small"></div>
</div>

<script>
const TXT = {
  fr: { hook: 'Ton enfant connaît combien de pays ?', caps: ['🌍 195 pays à explorer', '🧭 Un guide par pays', '📖 Des histoires vraies', '🎯 Un quiz à chaque chapitre', '🛂 Un passeport à tamponner', '🎮 Des jeux malins'], tag: "L'histoire du monde,<br>racontée aux enfants", offer: '🎁 3 jours gratuits', small: '4-12 ans · lu à voix haute · sans pub' },
  de: { hook: 'Wie viele Länder kennt dein Kind?', caps: ['🌍 195 Länder entdecken', '🧭 Ein Guide pro Land', '📖 Wahre Geschichten', '🎯 Ein Quiz pro Kapitel', '🛂 Ein Reisepass zum Stempeln', '🎮 Clevere Spiele'], tag: 'Die Geschichte der Welt,<br>für Kinder erzählt', offer: '🎁 3 Tage gratis', small: '4-12 Jahre · zum Vorlesen · ohne Werbung' },
}
const lang = new URLSearchParams(location.search).get('lang') || 'fr'
const T = TXT[lang]
const SHOTS = ['map', 'country', 'card1_open', 'quiz_ok', 'passport', 'games']
const FLAGS = '🇯🇵🇧🇷🇪🇬🇫🇷🇮🇳🇲🇽🇨🇦🇰🇪🇳🇴🇦🇺🇲🇦🇨🇳🇮🇹🇵🇪🇬🇷🇸🇳🇻🇳🇩🇪🇹🇷🇿🇦🇦🇷🇮🇸🇲🇳🇳🇵🇺🇾🇰🇷🇪🇸🇬🇧🇵🇭🇨🇱🇮🇩🇳🇬🇪🇹🇨🇴'
const flags = [...new Intl.Segmenter().segment(FLAGS)].map((s) => s.segment)
const $ = (i) => document.getElementById(i)
const rows = ['r1', 'r2', 'r3', 'r4']
rows.forEach((r, i) => { const el = $(r); el.style.top = `${150 + i * 170 + (i > 1 ? 760 : 0)}px`; el.textContent = Array.from({ length: 30 }, (_, k) => flags[(k * 3 + i * 7) % flags.length]).join(' ') })
$('hook').innerHTML = T.hook.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ')
$('tag').innerHTML = T.tag; $('offer').textContent = T.offer; $('small').textContent = T.small
const imgs = SHOTS.map((s) => { const im = document.createElement('img'); im.src = `shots/${lang}/${s}.png`; $('screen').appendChild(im); return im })

const clamp = (x) => Math.max(0, Math.min(1, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const back = (x) => { const s = 1.6; x -= 1; return x * x * ((s + 1) * x + s) + 1 }
const words = [...document.querySelectorAll('#hook .w')]
const A = 2.8, B = 11.8, END = 15.5   // decoupage des scenes
const PER = (B - A) / SHOTS.length

window.render = function (t) {
  // fond : degrade qui tourne doucement
  const h = 30 + Math.sin(t * 0.4) * 10
  $('bg').style.background = t < B ? `linear-gradient(${160 + t * 4}deg, hsl(${h} 100% 66%), hsl(${h - 18} 100% 55%) 55%, hsl(205 85% 58%))` : 'linear-gradient(165deg,#43C27A,#1E88E5)'
  const vis = (a, b) => Math.min(prog(t, a, a + 0.25), 1 - prog(t, b - 0.22, b))
  $('L1').style.opacity = vis(0, A); $('L2').style.opacity = vis(A, B); $('L3').style.opacity = t >= B ? prog(t, B, B + 0.25) : 0

  // 1 — drapeaux qui defilent + accroche mot a mot
  rows.forEach((r, i) => { $(r).style.transform = `translateX(${(i % 2 ? -900 : -200) + (i % 2 ? 1 : -1) * t * 170}px)` })
  words.forEach((w, i) => { const p = prog(t, 0.25 + i * 0.14, 0.55 + i * 0.14); w.style.opacity = p; w.style.transform = `translateY(${(1 - eo(p)) * 60}px) scale(${0.8 + 0.2 * back(p)})` })

  // 2 — telephone, ecrans qui changent toutes les 1,5 s
  const lt = t - A
  const idx = Math.min(SHOTS.length - 1, Math.max(0, Math.floor(lt / PER)))
  $('phone').style.transform = `translateY(${(1 - eo(prog(t, A, A + 0.6))) * 700}px) rotate(${Math.sin(t * 1.3) * 1.6}deg)`
  imgs.forEach((im, i) => {
    const st = i * PER
    const p = prog(lt, st, st + 0.35)
    const out = i < idx ? 1 : 0
    im.style.opacity = i === idx || (i === idx - 1 && p < 1) ? 1 : (i === idx ? 1 : 0)
    im.style.transform = i === idx ? `translateY(${(1 - eo(p)) * 100}%)` : out ? 'translateY(-12%)' : 'translateY(100%)'
    im.style.zIndex = i === idx ? 2 : 1
    // petit defilement vers le bas pour les longues pages
    if (i === idx && (SHOTS[i] === 'passport')) im.style.transform += ` translateY(${-prog(lt, st + 0.5, st + PER) * 6}%)`
  })
  const cp = prog(lt, idx * PER, idx * PER + 0.3)
  $('cap').textContent = T.caps[idx]
  $('cap').style.transform = `translateX(-50%) scale(${0.85 + 0.15 * back(cp)})`
  $('cap').style.opacity = cp

  // 3 — fin
  $('globe').style.transform = `translateX(-50%) rotate(${Math.sin(t * 2) * 8}deg) scale(${back(prog(t, B, B + 0.4))})`
  $('logo').style.transform = `translateX(-50%) scale(${back(prog(t, B + 0.1, B + 0.5))})`
  $('tag').style.opacity = prog(t, B + 0.4, B + 0.8)
  $('offer').style.transform = `translateX(-50%) scale(${back(prog(t, B + 0.8, B + 1.3)) * (1 + Math.sin(t * 6) * 0.025)})`
  $('small').style.opacity = prog(t, B + 1.2, B + 1.6)
}
window.ready = async function () {
  await document.fonts.ready
  await Promise.all(imgs.map((im) => im.decode().catch(() => {})))
  await document.fonts.load('120px "Noto Color Emoji"', FLAGS + '✈️⭐🌍🎁🧭📖🎯🛂🎮')
  await document.fonts.load('700 100px Fredoka'); await document.fonts.load('900 100px Nunito')
  return true
}
render(0)
</script>
</body>
</html>
