<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1640px;height:624px;overflow:hidden}
body{position:relative;font-family:Nunito,sans-serif;background:linear-gradient(120deg,#FFF6D8 0%,#FFE7A8 45%,#BFE3FF 100%)}
.e{font-family:'Noto Color Emoji';line-height:1;position:absolute}
.cloud{opacity:.9}
/* zone utile centree (visible aussi sur mobile) : 1150 px */
.wrap{position:absolute;left:245px;width:1150px;top:0;height:624px;display:flex;align-items:center;gap:40px}
.txt{flex:1}
.logo{font-family:Fredoka,sans-serif;font-weight:700;font-size:96px;line-height:1}
h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:54px;line-height:1.08;color:#1A2A4F;margin:14px 0 18px}
h1 em{font-style:normal;background:#FF7A00;color:#fff;border-radius:16px;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;max-width:640px}
.chip{background:#fff;border-radius:999px;padding:9px 18px;font-size:23px;font-weight:900;color:#2E7D4F;box-shadow:0 4px 12px rgba(26,42,79,.08)}
.chip.o{background:#FF7A00;color:#fff}
.phones{position:relative;width:420px;height:624px}
.ph{position:absolute;width:236px;border-radius:34px;border:9px solid #1A2A4F;background:#1A2A4F;box-shadow:0 24px 50px rgba(26,42,79,.3);overflow:hidden}
.ph img{display:block;width:100%;border-radius:25px}
</style></head><body>
<span class="e cloud" style="left:70px;top:60px;font-size:80px">☁️</span>
<span class="e cloud" style="left:1480px;top:440px;font-size:70px">☁️</span>
<span class="e" style="left:150px;top:470px;font-size:56px">✈️</span>
<span class="e" style="left:1440px;top:80px;font-size:64px">🌍</span>
<div class="wrap">
  <div class="txt">
    <div class="logo"><span style="color:#FF7A00">Moka</span><span style="color:#1E88E5">libo</span></div>
    <h1>L'histoire du monde,<br><em>racontée</em> aux enfants</h1>
    <div class="chips">
      <span class="chip">📖 Histoires vraies</span>
      <span class="chip">🔊 Lues à voix haute</span>
      <span class="chip">🎯 Quiz et jeux</span>
      <span class="chip">🌍 195 pays</span>
      <span class="chip">👧 4-12 ans</span>
      <span class="chip o">🎁 3 jours gratuits · mokalibo.com</span>
    </div>
  </div>
  <div class="phones">
    <div class="ph" style="left:10px;top:120px;transform:rotate(-6deg)"><img src="../video/shots/fr/card1_open.png"></div>
    <div class="ph" style="left:170px;top:60px;transform:rotate(4deg)"><img src="../video/shots/fr/home.png"></div>
  </div>
</div>
</body></html>
