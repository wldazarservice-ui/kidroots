<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;position:relative;font-family:Fredoka,sans-serif}
.bg{position:absolute;inset:0}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.globe{position:absolute;left:50%;top:430px;transform:translate(-50%,-50%);font-family:'Noto Color Emoji';font-size:470px;line-height:1;filter:drop-shadow(0 30px 40px rgba(0,0,0,0.25))}
.pill{position:absolute;left:50%;top:790px;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:18px 70px 26px;box-shadow:0 18px 40px rgba(0,0,0,0.22);white-space:nowrap}
.pill span{font-size:150px;font-weight:700;letter-spacing:2px;line-height:1}
.star{position:absolute;font-family:'Noto Color Emoji';line-height:1}
</style></head><body>
<div class="bg" id="bg"></div>
<div class="ring" style="width:820px;height:820px;background:rgba(255,255,255,0.16)"></div>
<div class="ring" style="width:640px;height:640px;background:rgba(255,255,255,0.18)"></div>
<div class="globe">🌍</div>
<span class="star" style="left:250px;top:200px;font-size:70px">✨</span>
<span class="star" style="left:760px;top:250px;font-size:56px">⭐</span>
<div class="pill"><span style="color:#FF7A00">Moka</span><span style="color:#1E88E5">libo</span></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'orange'
document.getElementById('bg').style.background = v==='orange'
 ? 'radial-gradient(circle at 50% 38%, #FFE066 0%, #FFB300 45%, #FF7A00 100%)'
 : 'radial-gradient(circle at 50% 38%, #64B5F6 0%, #1E88E5 50%, #0D47A1 100%)'
</script></body></html>
